<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Verification</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">BUILDSTART MVP</p>
      <h1>Upload a payment slip</h1>
      <p class="intro">Upload an image or PDF. Image uploads are saved and scanned for an account number and payment amount.</p>
      <form id="upload-form">
        <label class="dropzone" for="payment-slip">
          <span id="file-label">Choose a JPG, PNG, WebP, or PDF</span>
          <input id="payment-slip" name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required />
        </label>
        <button type="submit">Upload payment slip</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="ocr-result" hidden aria-live="polite">
        <h2>OCR result</h2>
        <p><strong>Account number:</strong> <span id="account-number">Not found</span></p>
        <p><strong>Payment amount:</strong> <span id="payment-amount">Not found</span></p>
        <p id="ocr-note"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
