<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Verification</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">BUILDSTART MVP</p>
      <h1>Verify a payment slip</h1>
      <p class="intro">Find the order first, then upload its payment slip. We will compare OCR results with the saved payment expectation.</p>
      <form id="order-form" class="lookup-form">
        <label for="order-id">Order ID</label>
        <div class="lookup-row">
          <input id="order-id" type="text" placeholder="Example: ORD-1001" required />
          <button type="submit">Find order</button>
        </div>
      </form>
      <section id="order-result" hidden aria-live="polite">
        <h2>Order found</h2>
        <p><strong>Customer:</strong> <span id="customer-name"></span></p>
        <p><strong>Expected payment:</strong> <span id="expected-payment"></span></p>
        <p><strong>Business account:</strong> ending <span id="business-account"></span></p>
      </section>
      <form id="upload-form">
        <fieldset id="upload-section" disabled>
          <label class="dropzone" for="payment-slip">
            <span id="file-label">Choose a JPG, PNG, WebP, or PDF</span>
            <input id="payment-slip" name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required />
          </label>
          <button type="submit">Upload &amp; verify payment slip</button>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="ocr-result" hidden aria-live="polite">
        <h2>OCR result</h2>
        <p><strong>Account number:</strong> <span id="account-number">Not found</span></p>
        <p><strong>Payment amount:</strong> <span id="payment-amount">Not found</span></p>
        <p id="ocr-note"></p>
      </section>
      <section id="decision-result" hidden aria-live="polite">
        <h2 id="decision-title"></h2>
        <p id="decision-note"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
